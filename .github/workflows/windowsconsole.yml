name: Windows

on:
  push:
    branches:
      - master
      - main
      - develop
      - add_ci
  pull_request:
    branches:
      - master
      - main
      - develop

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      
      - name: Setup CMake 4.1
        uses: jwlawson/actions-setup-cmake@v2
        with:
          # Use '4.1.x' to automatically get the latest 4.1.z release
          cmake-version: '4.1.x'

      - name: Verify Version
        run: cmake --version

      - uses: actions/cache@v5
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: configure
        run: cmake -Sexamples/console -Bbuild

      - name: build
        run: cmake --build build --config Debug -j4
